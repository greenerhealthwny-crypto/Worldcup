<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Daily Strategy Drill</title>
<meta name="description" content="A 10-minute daily drill that keeps logic, reasoning and strategy sharp.">
<style>
:root{--bg:#f6f4ef;--card:#fff;--ink:#1c1b19;--mute:#6b675f;--line:#e2ded4;--accent:#9a3b12;--chip:#f0e6dc}
@media (prefers-color-scheme:dark){:root{--bg:#141412;--card:#1e1d1a;--ink:#efece4;--mute:#a09b90;--line:#33312c;--accent:#e8a070;--chip:#2b2620}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.55 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
main{max-width:640px;margin:0 auto;padding:20px 16px 64px}
header h1{font-size:1.1rem;margin:0;letter-spacing:.04em;text-transform:uppercase;color:var(--accent)}
header p{margin:.2rem 0 0;color:var(--mute);font-size:.9rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-top:16px}
.date{color:var(--mute);font-size:.9rem}
h2{font-size:1.35rem;margin:.2rem 0 .6rem;line-height:1.25}
h3{font-size:.8rem;text-transform:uppercase;letter-spacing:.06em;color:var(--accent);margin:1.4rem 0 .4rem}
.q{font-size:1.05rem;font-weight:600}
ol,ul{padding-left:1.25rem;margin:.3rem 0}li{margin:.35rem 0}
.timer{display:flex;gap:8px;flex-wrap:wrap;margin:.4rem 0 0}
.chip{background:var(--chip);border-radius:999px;padding:3px 10px;font-size:.8rem}
.score{display:flex;gap:6px;margin-top:.5rem}
.score button{flex:1;padding:10px 0;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;font:inherit;cursor:pointer}
.score button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
details{margin-top:1rem}summary{cursor:pointer;font-weight:600}
.archive a{display:block;padding:10px 0;border-bottom:1px solid var(--line);color:var(--ink);text-decoration:none}
.archive a span{color:var(--mute);font-size:.85rem;display:block}
#err{color:#b00020}
</style>
</head>
<body>
<main>
<header><h1>Daily Strategy Drill</h1><p>10 minutes. Logic, reasoning, strategy.</p></header>
<div id="app"><div class="card">Loading…</div></div>
<div class="card archive"><h3 style="margin-top:0">Past drills</h3><div id="archive"></div></div>
</main>
<script>
(function(){
  var app=document.getElementById('app'),arch=document.getElementById('archive');
  function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
  function store(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){return null}}
  function render(d){
    var key='score-'+d.date;
    var checks=d.checks.map(function(c){return '<li>'+esc(c)+'</li>'}).join('');
    var steps=d.steps.map(function(c){return '<li>'+esc(c)+'</li>'}).join('');
    var btns='';for(var i=0;i<=5;i++)btns+='<button data-s="'+i+'">'+i+'</button>';
    app.innerHTML='<article class="card"><div class="date">'+esc(d.weekday)+', '+esc(d.date)+'</div>'+
      '<h2>'+esc(d.model)+'</h2><p class="q">'+esc(d.question)+'</p><p>'+esc(d.angle)+'</p>'+
      '<h3>Scenario</h3><p>'+esc(d.scenario)+'</p>'+
      '<h3>Task (10 minutes)</h3><div class="timer"><span class="chip">0-2 read and frame</span><span class="chip">2-7 write 5 steps</span><span class="chip">7-10 check</span></div>'+
      '<ol>'+steps+'</ol>'+
      '<details><summary>Answer key</summary><ul>'+checks+'</ul><p><strong>Trap:</strong> '+esc(d.trap)+'</p><p style="color:var(--mute);font-size:.9rem">'+esc(d.scoreNote||'')+'</p>'+
      '<div class="score" role="group" aria-label="Score">'+btns+'</div></details>'+
      '<h3>Bonus: '+esc(d.bonusName)+' (30 sec)</h3><p>'+esc(d.bonus)+'</p></article>';
    var saved=store(key);
    app.querySelectorAll('.score button').forEach(function(b){
      if(saved===b.dataset.s)b.classList.add('on');
      b.onclick=function(){store(key,b.dataset.s);app.querySelectorAll('.score button').forEach(function(x){x.classList.toggle('on',x===b)})}
    });
    document.title=d.model+' - Daily Strategy Drill';
  }
  fetch('data/drills.json',{cache:'no-store'}).then(function(r){return r.json()}).then(function(list){
    list.sort(function(a,b){return a.date<b.date?1:-1});
    var want=new URLSearchParams(location.search).get('d');
    var cur=list.filter(function(x){return x.date===want})[0]||list[0];
    render(cur);
    arch.innerHTML=list.map(function(x){return '<a href="?d='+esc(x.date)+'">'+esc(x.date)+' · '+esc(x.weekday)+'<span>'+esc(x.model)+'</span></a>'}).join('');
  }).catch(function(){app.innerHTML='<div class="card" id="err">Could not load the drill data.</div>'});
})();
</script>
</body>
</html>
