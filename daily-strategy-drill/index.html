<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Daily Strategy Drill</title>
<meta name="description" content="A 10-minute daily drill that keeps logic, reasoning and strategy sharp.">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
<header><h1>Daily Strategy Drill</h1><p>10 minutes. Logic, reasoning, strategy.</p></header>
<nav class="tabs"><a class="on" href="./">Today's Drill</a><a href="forge.html">Idea Forge</a><a href="quiz.html">Quiz</a></nav>
<div id="app"><div class="card">Loading…</div></div>
<div class="card archive"><h3 style="margin-top:0">Past drills</h3><div id="archive"></div></div>
</main>
<script>
(function(){
  var app=document.getElementById('app'),arch=document.getElementById('archive');
  function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
  function store(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){return null}}
  function render(d){
    var key='score-'+d.date;
    var checks=d.checks.map(function(c){return '<li>'+esc(c)+'</li>'}).join('');
    var steps=d.steps.map(function(c){return '<li>'+esc(c)+'</li>'}).join('');
    var btns='';for(var i=0;i<=5;i++)btns+='<button data-s="'+i+'">'+i+'</button>';
    app.innerHTML='<article class="card"><div class="date">'+esc(d.weekday)+', '+esc(d.date)+'</div>'+
      '<h2>'+esc(d.model)+'</h2><p class="q">'+esc(d.question)+'</p><p>'+esc(d.angle)+'</p>'+
      '<h3>Scenario</h3><p>'+esc(d.scenario)+'</p>'+
      '<h3>Task (10 minutes)</h3><div class="timer"><span class="chip">0-2 read and frame</span><span class="chip">2-7 write 5 steps</span><span class="chip">7-10 check</span></div>'+
      '<ol>'+steps+'</ol>'+
      '<details><summary>Answer key</summary><ul>'+checks+'</ul><p><strong>Trap:</strong> '+esc(d.trap)+'</p><p style="color:var(--mute);font-size:.9rem">'+esc(d.scoreNote||'')+'</p>'+
      '<div class="score" role="group" aria-label="Score">'+btns+'</div></details>'+
      '<h3>Bonus: '+esc(d.bonusName)+' (30 sec)</h3><p>'+esc(d.bonus)+'</p></article>';
    var saved=store(key);
    app.querySelectorAll('.score button').forEach(function(b){
      if(saved===b.dataset.s)b.classList.add('on');
      b.onclick=function(){store(key,b.dataset.s);app.querySelectorAll('.score button').forEach(function(x){x.classList.toggle('on',x===b)})}
    });
    document.title=d.model+' - Daily Strategy Drill';
  }
  fetch('data/drills.json',{cache:'no-store'}).then(function(r){return r.json()}).then(function(list){
    list.sort(function(a,b){return a.date<b.date?1:-1});
    var want=new URLSearchParams(location.search).get('d');
    var cur=list.filter(function(x){return x.date===want})[0]||list[0];
    render(cur);
    arch.innerHTML=list.map(function(x){return '<a href="?d='+esc(x.date)+'">'+esc(x.date)+' · '+esc(x.weekday)+'<span>'+esc(x.model)+'</span></a>'}).join('');
  }).catch(function(){app.innerHTML='<div class="card err">Could not load the drill data.</div>'});
})();
</script>
</body>
</html>
