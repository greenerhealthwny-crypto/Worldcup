<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Strategy Quiz - Daily Strategy Drill</title>
<meta name="description" content="A 10-question quiz on mental models, offers, focus, funnels and strategy.">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
<header><h1>Daily Strategy Drill</h1><p>Strategy Quiz: 10 questions from your bookshelf.</p></header>
<nav class="tabs"><a href="./">Today's Drill</a><a href="forge.html">Idea Forge</a><a class="on" href="quiz.html">Quiz</a></nav>
<div id="app"><div class="card">Loading…</div></div>
</main>
<script>
(function(){
  var app=document.getElementById('app'),ALL=[],round=[],i=0,score=0,missed=[],ROUND=10;
  function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
  function get(k,d){try{var v=localStorage.getItem(k);return v===null?d:JSON.parse(v)}catch(e){return d}}
  function put(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
  function shuffle(a){a=a.slice();for(var j=a.length-1;j>0;j--){var k=Math.floor(Math.random()*(j+1));var t=a[j];a[j]=a[k];a[k]=t}return a}

  function start(){
    var books={};ALL.forEach(function(q){books[q.src]=1});
    var best=get('quiz-best',null),plays=get('quiz-plays',0);
    app.innerHTML='<section class="card"><h2>Think like the books</h2>'+
      '<p>10 random questions from '+Object.keys(books).length+' books: mental models, offers, focus, funnels, copywriting, sales and strategy. Each answer comes with a short why.</p>'+
      '<div class="stats"><div><b>'+(best===null?'-':best+'/'+ROUND)+'</b><span>best score</span></div><div><b>'+plays+'</b><span>rounds played</span></div><div><b>'+ALL.length+'</b><span>questions in the bank</span></div></div>'+
      '<div class="row"><button class="btn" id="go">Start quiz</button></div></section>';
    document.getElementById('go').onclick=function(){round=shuffle(ALL).slice(0,ROUND);i=0;score=0;missed=[];ask()};
  }

  function ask(){
    var q=round[i],opts=shuffle([q.a].concat(q.w));
    app.innerHTML='<section class="card"><div class="date">Question '+(i+1)+' of '+round.length+' · Score '+score+'</div>'+
      '<div class="bar"><i style="width:'+(i/round.length*100)+'%"></i></div>'+
      '<div class="deck" style="margin-top:1rem">'+esc(q.src)+'</div><p class="q">'+esc(q.q)+'</p>'+
      '<div class="opts">'+opts.map(function(o){return '<button data-o="'+esc(o)+'">'+esc(o)+'</button>'}).join('')+'</div>'+
      '<div id="after"></div></section>';
    app.querySelectorAll('.opts button').forEach(function(b){b.onclick=function(){
      var ok=b.dataset.o===q.a;if(ok)score++;else missed.push(q);
      app.querySelectorAll('.opts button').forEach(function(x){x.disabled=true;if(x.dataset.o===q.a)x.classList.add('right');else if(x===b)x.classList.add('wrong')});
      var last=i===round.length-1;
      document.getElementById('after').innerHTML='<div class="explain"><b>'+(ok?'Right.':'Not quite.')+'</b> '+esc(q.why)+'</div>'+
        '<div class="row"><button class="btn" id="next">'+(last?'See my score':'Next question')+'</button></div>';
      var n=document.getElementById('next');n.focus();
      n.onclick=function(){i++;if(i<round.length)ask();else end()};
    }});
  }

  function end(){
    var best=get('quiz-best',null);if(best===null||score>best){best=score;put('quiz-best',score)}
    put('quiz-plays',get('quiz-plays',0)+1);
    var msg=score>=9?'Strategist level. Take this thinking to the Idea Forge.':score>=6?'Solid. Review the misses below and try again tomorrow.':'Good start. Each miss below is a lesson to keep.';
    app.innerHTML='<section class="card"><h2>You scored '+score+' out of '+round.length+'</h2><p>'+msg+'</p>'+
      '<div class="bar"><i style="width:'+(score/round.length*100)+'%"></i></div>'+
      '<p class="mute">Best: '+best+'/'+round.length+'</p>'+
      (missed.length?'<h3>Review your misses</h3><ul>'+missed.map(function(q){return '<li><b>'+esc(q.q)+'</b><br>'+esc(q.a)+' <span class="mute">('+esc(q.src)+')</span></li>'}).join('')+'</ul>':'')+
      '<div class="row"><button class="btn" id="again">Play again</button><a class="btn ghost" href="forge.html">Go to Idea Forge</a></div></section>';
    document.getElementById('again').onclick=function(){round=shuffle(ALL).slice(0,ROUND);i=0;score=0;missed=[];ask()};
  }

  fetch('data/quiz.json',{cache:'no-store'}).then(function(r){return r.json()}).then(function(d){ALL=d;start()})
    .catch(function(){app.innerHTML='<div class="card err">Could not load the quiz.</div>'});
})();
</script>
</body>
</html>
